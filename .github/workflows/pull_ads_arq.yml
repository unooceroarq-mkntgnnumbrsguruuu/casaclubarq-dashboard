name: Pull ARQ Ads Data

on:
  schedule:
    - cron: "0 13 * * *"   # 07:00 AM CDMX (UTC-6)
  workflow_dispatch:

jobs:
  pull_ads:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install google-ads requests pyyaml

      - name: Ejecutar pull de datos ARQ
        env:
          GOOGLE_ADS_YAML:   ${{ secrets.GOOGLE_ADS_YAML }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          SHEET_API_URL_ARQ: ${{ secrets.SHEET_API_URL_ARQ }}
        run: python3 pull_ads_arq.py
