<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>e.ARGAMA // MKT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:    #0D0F12;
  --bg2:   #13171E;
  --bg3:   #1C2028;
  --bd:    #252B35;
  --bd2:   #353D4A;
  --txt:   #BFC7D2;
  --dim:   #4E5764;
  --grn:   #39D353;
  --red:   #F85149;
  --yel:   #E3B341;
  --blu:   #79C0FF;
  --pur:   #BC8CFF;
  --mono:  'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace;
}
body{
  background:var(--bg);color:var(--txt);font-family:var(--mono);
  font-size:13px;line-height:1.6;min-height:100dvh;
}

/* ── HEADER ── */
.hdr{
  background:var(--bg2);border-bottom:1px solid var(--bd);
  padding:10px 16px;display:flex;align-items:center;
  justify-content:space-between;position:sticky;top:0;z-index:100;
  gap:12px;flex-wrap:wrap;
}
.hdr-brand{display:flex;align-items:center;gap:10px}
.hdr-dot{width:8px;height:8px;background:var(--red);border-radius:50%;flex-shrink:0}
.hdr-name{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.hdr-sub{font-size:9px;color:var(--dim);letter-spacing:.08em;display:block;margin-top:1px}
.hdr-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.conn{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--dim)}
.conn-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.conn-dot.ok{background:var(--grn)}
.conn-dot.wait{background:var(--yel);animation:pulse 1.2s infinite}
.conn-dot.err{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.ts{font-size:10px;color:var(--dim)}
.btn{
  background:transparent;border:1px solid var(--bd2);color:var(--dim);
  font-family:var(--mono);font-size:10px;padding:5px 11px;cursor:pointer;
  text-transform:uppercase;letter-spacing:.08em;
}
.btn:hover{border-color:var(--txt);color:var(--txt)}

/* ── TABS ── */
.tabs{
  background:var(--bg2);border-bottom:1px solid var(--bd);
  display:flex;padding:0 16px;overflow-x:auto;scrollbar-width:none;
  position:sticky;top:49px;z-index:90;
}
.tabs::-webkit-scrollbar{display:none}
.tab{
  background:transparent;border:none;
  border-bottom:2px solid transparent;
  color:var(--dim);font-family:var(--mono);font-size:11px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;padding:10px 14px;
  cursor:pointer;white-space:nowrap;
}
.tab:hover{color:var(--txt)}
.tab.on{color:var(--blu);border-bottom-color:var(--blu)}

/* ── MAIN ── */
.main{padding:16px;max-width:960px;margin:0 auto;padding-bottom:60px}

/* ── SECTION ── */
.sec{margin-bottom:22px}
.sec-hd{
  font-size:9px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  color:var(--dim);padding:0 0 7px 0;border-bottom:1px solid var(--bd);
  margin-bottom:12px;display:flex;align-items:center;gap:8px;
}
.sec-hd-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}

/* ── ALERTS ── */
.alert-row{
  padding:9px 12px;margin-bottom:6px;border-left:3px solid;
  font-size:12px;background:var(--bg2);
}
.alert-row.urgent {border-color:var(--red);background:rgba(248,81,73,.06)}
.alert-row.critical{border-color:var(--red);background:rgba(248,81,73,.04)}
.alert-row.warning {border-color:var(--yel);background:rgba(227,179,65,.04)}
.alert-level{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:2px}
.urgent  .alert-level,.critical .alert-level{color:var(--red)}
.warning .alert-level{color:var(--yel)}
.alert-msg{color:var(--txt);line-height:1.4}
.alert-detail{font-size:10px;color:var(--dim);margin-top:3px}
.no-alerts{
  font-size:11px;color:var(--grn);padding:8px 12px;
  border-left:3px solid var(--grn);background:rgba(57,211,83,.04);
}

/* ── METRIC GRID ── */
.mrows{display:grid;grid-template-columns:repeat(2,1fr);gap:0;border:1px solid var(--bd)}
@media(min-width:600px){.mrows{grid-template-columns:repeat(3,1fr)}}
.mrow{
  padding:10px 12px;border-right:1px solid var(--bd);border-bottom:1px solid var(--bd);
  display:flex;flex-direction:column;gap:2px;
}
.mrow:nth-child(2n)  {border-right:none}
@media(min-width:600px){
  .mrow:nth-child(2n){border-right:1px solid var(--bd)}
  .mrow:nth-child(3n){border-right:none}
}
.mrow-lbl{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.mrow-val{font-size:18px;font-weight:700;color:var(--txt);line-height:1.1}
.mrow-val.red{color:var(--red)}
.mrow-val.yel{color:var(--yel)}
.mrow-val.grn{color:var(--grn)}
.mrow-note{font-size:9px;color:var(--dim)}
.mrow-note.red{color:var(--red)}
.mrow-note.yel{color:var(--yel)}
.mrow-note.grn{color:var(--grn)}

/* ── BADGE ── */
.badge{
  font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  padding:2px 7px;border-radius:2px;display:inline-block;
}
.badge.ok {background:rgba(57,211,83,.12);color:var(--grn)}
.badge.err{background:rgba(248,81,73,.12);color:var(--red)}
.badge.act{background:rgba(121,192,255,.12);color:var(--blu)}
.badge.pau{background:rgba(78,87,100,.15);color:var(--dim)}

/* ── COLLAPSIBLE ── */
.coll-wrap{margin-top:12px}
.coll-btn{
  background:transparent;border:none;color:var(--dim);font-family:var(--mono);
  font-size:10px;cursor:pointer;padding:4px 0;display:flex;align-items:center;gap:6px;
  letter-spacing:.06em;
}
.coll-btn:hover{color:var(--txt)}
.coll-body{display:none}
.coll-body.open{display:block;margin-top:6px}

/* ── TABLE ── */
.tbl{width:100%;border-collapse:collapse;font-size:11px}
.tbl th{
  font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
  text-align:left;padding:5px 8px;border-bottom:1px solid var(--bd);font-weight:400;
}
.tbl td{padding:5px 8px;border-bottom:1px solid rgba(37,43,53,.8);color:var(--txt);vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--bg3)}
.tbl .r{text-align:right;font-variant-numeric:tabular-nums}
.tbl .red{color:var(--red)}
.tbl .yel{color:var(--yel)}
.tbl .grn{color:var(--grn)}
.tbl .dim{color:var(--dim)}

/* ── BALANCE CHIP ── */
.bal-chip{
  display:inline-flex;align-items:center;gap:8px;margin-top:10px;
  font-size:10px;padding:5px 10px;border:1px solid var(--bd);background:var(--bg3);
}
.bal-chip-lbl{color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.bal-chip-val{font-weight:700}
.bal-chip-val.ok {color:var(--grn)}
.bal-chip-val.low{color:var(--yel)}
.bal-chip-val.neg{color:var(--red)}

/* ── STATES ── */
.loading{padding:60px 16px;text-align:center;color:var(--dim);font-size:12px}
.setup-wrap{padding:40px 16px;text-align:center;max-width:480px;margin:0 auto}
.setup-wrap h2{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--blu);margin-bottom:16px}
.setup-wrap p{font-size:10px;color:var(--dim);margin-bottom:14px;line-height:1.8}
.setup-wrap input{
  background:var(--bg3);border:1px solid var(--bd2);color:var(--txt);
  font-family:var(--mono);font-size:11px;padding:9px 12px;width:100%;margin-bottom:10px;
}
.setup-wrap input:focus{outline:none;border-color:var(--blu)}
</style>
</head>
<body>

<!-- HEADER -->
<header class="hdr">
  <div class="hdr-brand">
    <div class="hdr-dot"></div>
    <div>
      <div class="hdr-name">e.ARGAMA</div>
      <span class="hdr-sub">marketing intelligence v2</span>
    </div>
  </div>
  <div class="hdr-right">
    <div class="conn">
      <div class="conn-dot wait" id="conn-dot"></div>
      <span id="ts-lbl">—</span>
    </div>
    <button class="btn" onclick="loadData()">&#8635; refresh</button>
    <button class="btn" onclick="openSetup()">&#9881; config</button>
  </div>
</header>

<!-- PERIOD TABS -->
<nav class="tabs">
  <button class="tab on" data-p="7d"    onclick="setPeriod('7d',this)">7D</button>
  <button class="tab"    data-p="30d"   onclick="setPeriod('30d',this)">30D</button>
  <button class="tab"    data-p="90d"   onclick="setPeriod('90d',this)">90D</button>
  <button class="tab"    data-p="today" onclick="setPeriod('today',this)">HOY</button>
</nav>

<!-- CONTENT -->
<main class="main" id="main">
  <div class="loading" id="loading">inicializando...</div>
</main>

<script>
const STORE_KEY = 'arq-sheet-url-v2';
let DATA   = null;
let PERIOD = '7d';

/* ── URL helpers ── */
function getUrl(){ return localStorage.getItem(STORE_KEY)||''; }
function setUrl(u){ localStorage.setItem(STORE_KEY,u); }

/* ── Setup ── */
function openSetup(){
  document.getElementById('main').innerHTML = `
    <div class="setup-wrap">
      <h2>// configurar fuente de datos</h2>
      <p>Pega la URL de Google Apps Script (termina en /exec):</p>
      <input id="url-in" type="text" placeholder="https://script.google.com/macros/s/..." value="${getUrl()}">
      <button class="btn" style="display:block;margin:0 auto;padding:8px 20px" onclick="saveUrl()">guardar &rarr;</button>
    </div>`;
}
function saveUrl(){
  const u = document.getElementById('url-in').value.trim();
  if(!u) return;
  setUrl(u);
  loadData();
}

/* ── Connection indicator ── */
function setConn(state){
  document.getElementById('conn-dot').className = 'conn-dot '+state;
}

/* ── Period switch ── */
function setPeriod(p,btn){
  PERIOD = p;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t===btn));
  if(DATA) render();
}

/* ── Load data ── */
async function loadData(){
  const url = getUrl();
  if(!url){ openSetup(); return; }
  document.getElementById('main').innerHTML='<div class="loading" id="loading">cargando...</div>';
  setConn('wait');
  try{
    const r = await fetch(url+'?nc='+Date.now());
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j = await r.json();
    DATA = parsePayload(j);
    setConn('ok');
    render();
  }catch(e){
    setConn('err');
    document.getElementById('loading').textContent='error: '+e.message;
  }
}

function parsePayload(j){
  // Formato v2 directo
  if(j.periods) return j;
  // Formato v2 guardado en Sheet (el GAS devuelve el JSON directamente)
  if(j.error) return {_error: j.error};
  return {_legacy: true, _raw: j};
}

/* ── Formatters ── */
function fmt(n,d=2){
  if(n===undefined||n===null||n===''||isNaN(Number(n))) return '—';
  return Number(n).toLocaleString('es-MX',{minimumFractionDigits:d,maximumFractionDigits:d});
}
function fmx(n){ return '$'+fmt(n)+' MXN'; }
function pct(n){ if(!n&&n!==0) return '—'; return fmt(n,2)+'%'; }
function num(n){ if(n===undefined||n===null) return '—'; return Number(n).toLocaleString('es-MX'); }

/* ── Main render ── */
function render(){
  if(!DATA) return;
  if(DATA._error){ document.getElementById('main').innerHTML=`<div class="loading" style="color:var(--red)">error sheet: ${DATA._error}</div>`; return; }
  if(DATA._legacy){ document.getElementById('main').innerHTML=`<div class="loading" style="color:var(--yel)">&#9888; formato legacy — ejecuta pull_ads_arq.py v2 para actualizar</div>`; return; }

  const ts = DATA.timestamp ? new Date(DATA.timestamp).toLocaleString('es-MX') : '—';
  document.getElementById('ts-lbl').textContent = ts;

  const p  = DATA.periods && DATA.periods[PERIOD] ? DATA.periods[PERIOD] : {};
  const g  = p.google || {};
  const m  = p.meta   || {};
  const al = DATA.alerts || [];
  const ga = DATA.google_account || {};
  const ma = DATA.meta_account   || {};

  let html = '';

  /* ALERTAS */
  html += '<div class="sec">';
  html += '<div class="sec-hd"><div class="sec-hd-dot" style="background:var(--red)"></div>ALERTAS ACTIVAS</div>';
  if(al.length===0){
    html += '<div class="no-alerts">&#10003; sin alertas — todos los indicadores dentro de parametros</div>';
  } else {
    al.forEach(a=>{
      const lvl = a.level==='urgent'?'&#9679; URGENTE': a.level==='critical'?'&#9679; CRITICO':'&#9651; ALERTA';
      html += `<div class="alert-row ${a.level}">
        <div class="alert-level">${lvl} &mdash; ${a.code||''}</div>
        <div class="alert-msg">${a.msg||''}</div>
        ${a.detail?`<div class="alert-detail">${a.detail}</div>`:''}
      </div>`;
    });
  }
  html += '</div>';

  /* GOOGLE ADS */
  const gStatus = g.status==='ok'||!g.status ? 'ok' : 'err';
  const cpc     = g.cpc||0;
  const conv    = g.conversions!==undefined ? g.conversions : null;
  const isLost  = g.impression_share_lost_budget||0;

  html += '<div class="sec">';
  html += `<div class="sec-hd">
    <div class="sec-hd-dot" style="background:var(--blu)"></div>
    GOOGLE ADS &mdash; ${g.campaign||'ARQ_QRO_2026'}
    <span class="badge ${gStatus}" style="margin-left:6px">${gStatus==='ok'?'activo':g.status}</span>
    <span style="color:var(--dim);font-size:9px;margin-left:auto">${g.date_from||''} / ${g.date_to||''}</span>
  </div>`;

  html += '<div class="mrows">';
  html += mr('GASTO',         fmx(g.spend));
  html += mr('CLICS',         num(g.clicks));
  html += mr('IMPRESIONES',   num(g.impressions));
  html += mr('CTR',           pct(g.ctr));
  html += mr('CPC',           fmx(cpc), cpc>18?'red':cpc>15?'yel':'', cpc>18?'&#9651; sobre umbral $18':'');
  html += mr('CONVERSIONES',  conv!==null?num(conv):'—', conv===0&&(g.spend||0)>0?'red':conv>0?'grn':'', conv===0&&(g.spend||0)>0?'&#9679; urgente':'');
  html += mr('CPA',           g.cpa?fmx(g.cpa):'—');
  html += mr('IS PERDIDA PRE',isLost?isLost+'%':'—', isLost>30?'yel':'', isLost>30?'&#9651; presupuesto bajo':'');
  html += '</div>';

  /* Saldo Google */
  if(ga.balance!==undefined&&ga.balance>0){
    html += balChip('SALDO GOOGLE', fmx(ga.balance), ga.balance<2000?'low':'ok');
  }

  /* Keywords */
  const kws = g.keywords||[];
  if(kws.length>0){
    html += '<div class="coll-wrap">';
    html += `<button class="coll-btn" onclick="toggleColl(this)">&#9654; keywords (${kws.length})</button>`;
    html += '<div class="coll-body"><table class="tbl"><thead><tr><th>keyword</th><th>tipo</th><th class="r">clics</th><th class="r">gasto</th><th class="r">conv</th><th class="r">QS</th></tr></thead><tbody>';
    kws.slice(0,15).forEach(k=>{
      const mt = (k.match||'').replace('KEYWORD_MATCH_TYPE_UNSPECIFIED','').replace('KeywordMatchType.','').toLowerCase();
      html += `<tr>
        <td>${k.keyword||'—'}</td>
        <td class="dim">${mt}</td>
        <td class="r">${num(k.clicks)}</td>
        <td class="r">$${fmt(k.spend,0)}</td>
        <td class="r ${k.conv>0?'grn':'dim'}">${k.conv||0}</td>
        <td class="r">${k.qs||'—'}</td>
      </tr>`;
    });
    html += '</tbody></table></div></div>';
  }

  /* Terminos de busqueda */
  const sts = g.search_terms||[];
  if(sts.length>0){
    html += '<div class="coll-wrap">';
    html += `<button class="coll-btn" onclick="toggleColl(this)">&#9654; terminos de busqueda (${sts.length})</button>`;
    html += '<div class="coll-body"><table class="tbl"><thead><tr><th>termino</th><th class="r">clics</th><th class="r">gasto</th><th class="r">conv</th></tr></thead><tbody>';
    sts.slice(0,20).forEach(s=>{
      html += `<tr>
        <td>${s.term||'—'}</td>
        <td class="r">${num(s.clicks)}</td>
        <td class="r">$${fmt(s.spend,0)}</td>
        <td class="r ${s.conv>0?'grn':'dim'}">${s.conv||0}</td>
      </tr>`;
    });
    html += '</tbody></table></div></div>';
  }
  html += '</div>'; /* /sec google */

  /* META ADS */
  const mStatus = m.status==='ok'||!m.status ? 'ok' : 'err';
  const freq    = m.frequency||0;

  html += '<div class="sec">';
  html += `<div class="sec-hd">
    <div class="sec-hd-dot" style="background:var(--pur)"></div>
    META ADS &mdash; ${m.campaign||'2026_ARQ_QRO'}
    <span class="badge ${mStatus}" style="margin-left:6px">${mStatus==='ok'?'activo':m.status}</span>
    <span style="color:var(--dim);font-size:9px;margin-left:auto">${m.date_from||''} / ${m.date_to||''}</span>
  </div>`;

  html += '<div class="mrows">';
  html += mr('GASTO',          fmx(m.spend));
  html += mr('ALCANCE',        num(m.reach));
  html += mr('IMPRESIONES',    num(m.impressions));
  html += mr('FRECUENCIA',     freq?fmt(freq,1):'—', freq>5?'red':freq>3.5?'yel':'', freq>5?'&#9679; fatiga':freq>3.5?'&#9651; monitorear':'');
  html += mr('CPM',            fmx(m.cpm));
  html += mr('CLICS',          num(m.clicks));
  html += mr('CTR',            pct(m.ctr));
  html += mr('CONV. WHATSAPP', m.wa_conversations!==undefined?num(m.wa_conversations):'—', m.wa_conversations>0?'grn':'');
  html += mr('COSTO / WA',     m.cost_per_wa?fmx(m.cost_per_wa):'—');
  html += '</div>';

  /* Saldo Meta */
  if(ma.balance!==undefined){
    html += balChip(
      'SALDO META',
      fmx(ma.balance),
      ma.balance<=0?'neg':ma.balance<500?'low':'ok'
    );
  }

  /* Ad sets — abiertos por defecto */
  const adsets = m.ad_sets||[];
  if(adsets.length>0){
    html += '<div class="coll-wrap">';
    html += `<button class="coll-btn on" onclick="toggleColl(this)">&#9660; ad sets (${adsets.length})</button>`;
    html += '<div class="coll-body open"><table class="tbl"><thead><tr><th>ad set</th><th>estado</th><th class="r">gasto</th><th class="r">alcance</th><th class="r">freq</th><th class="r">WA</th><th class="r">$/WA</th></tr></thead><tbody>';
    adsets.forEach(as=>{
      const fa   = as.frequency||0;
      const fcls = fa>5?'red':fa>3.5?'yel':'';
      html += `<tr>
        <td>${as.name||'—'}</td>
        <td><span class="badge ${as.status==='ACTIVE'?'act':'pau'}">${as.status||'—'}</span></td>
        <td class="r">$${fmt(as.spend,0)}</td>
        <td class="r">${num(as.reach)}</td>
        <td class="r ${fcls}">${fa?fmt(fa,1):'—'}</td>
        <td class="r ${as.wa_convs>0?'grn':'dim'}">${as.wa_convs||0}</td>
        <td class="r">${as.cost_per_wa?'$'+fmt(as.cost_per_wa,0):'—'}</td>
      </tr>`;
    });
    html += '</tbody></table></div></div>';
  }
  html += '</div>'; /* /sec meta */

  document.getElementById('main').innerHTML = html;
}

/* ── Helpers de render ── */
function mr(label,val,color,note){
  const vc = color?` ${color}`:'';
  const nc = color?` ${color==='red'?'red':color==='yel'?'yel':'grn'}`:'';
  return `<div class="mrow">
    <span class="mrow-lbl">${label}</span>
    <span class="mrow-val${vc}">${val}</span>
    ${note?`<span class="mrow-note${nc}">${note}</span>`:''}
  </div>`;
}
function balChip(label,val,state){
  return `<div class="bal-chip">
    <span class="bal-chip-lbl">${label}</span>
    <span class="bal-chip-val ${state}">${val}</span>
  </div>`;
}
function toggleColl(btn){
  const body = btn.nextElementSibling;
  const open = body.classList.toggle('open');
  btn.innerHTML = btn.innerHTML.replace(open?'&#9654;':'&#9660;', open?'&#9660;':'&#9654;');
  btn.classList.toggle('on',open);
}

/* ── Init ── */
window.addEventListener('DOMContentLoaded',()=>{
  if(!getUrl()){ openSetup(); }
  else { loadData(); }
});
</script>
</body>
</html>
